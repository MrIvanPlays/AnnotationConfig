# --- flat
{
  "$schema": "http://json-schema.org/draft-07/schema#",
  "description": "The server's settings",
  "type": "object",
  "properties": {
    "config-version": {
      "description": "Don't change this",
      "type": "integer",
      "default": 2
    },
    "dotted.key": {
      "type": "string",
      "default": "value"
    },
    "levels": {
      "type": "array",
      "items": {
        "type": "integer",
        "maximum": 5
      },
      "default": [
        1,
        2
      ]
    },
    "marker": {
      "type": "string",
      "default": "#"
    },
    "big": {
      "type": "integer",
      "default": 7
    },
    "seed": {
      "type": "integer",
      "default": 42
    },
    "speed": {
      "type": "number",
      "maximum": 0.9,
      "default": 0.25
    },
    "ratio": {
      "type": "number",
      "minimum": 0.5,
      "default": 1.5
    },
    "whitelist": {
      "type": "boolean",
      "default": true
    },
    "level": {
      "type": "string",
      "enum": [
        "easy",
        "hard"
      ],
      "default": "hard"
    },
    "name": {
      "description": "Quotes \"and\" a back\\slash",
      "type": "string",
      "minLength": 3,
      "maxLength": 16,
      "default": "server"
    },
    "difficulty": {
      "type": "string",
      "examples": [
        "easy",
        "hard"
      ],
      "default": "easy"
    },
    "mode": {
      "type": "string",
      "enum": [
        "survival",
        "creative"
      ],
      "default": "survival"
    },
    "port": {
      "description": "The port to listen on\nbetween 1 and 65535",
      "type": "integer",
      "minimum": 1,
      "maximum": 65535,
      "default": 25565
    }
  }
}

# --- no-reference
# The server's settings

config-version=1

motd=hi

port=25565

# --- reference
# The server's settings

config-version=1

motd=hi

port=25565

