name: Maven Build

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        java: [ 25 ]

    name: Java ${{ matrix.java }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B package
